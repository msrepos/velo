server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    server_tokens off;

    # Crew is a standalone application. Never serve the SPA shell for admin routes.
    location = /admin { return 404; }
    location ^~ /admin/ { return 404; }

    # Keep authenticated crew API traffic on its own origin; responses are never cached.
    location /api/ {
        proxy_pass http://velo-api;
        proxy_set_header Host velo-api;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_cache off;
        add_header Cache-Control "no-store" always;
    }

    location = /health/live {
        access_log off;
        default_type text/plain;
        return 200 "Healthy\n";
    }

    location = /health/ready {
        access_log off;
        try_files /index.html =503;
    }

    location = /sw.js {
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
        try_files $uri =404;
    }

    location = /manifest.webmanifest {
        default_type application/manifest+json;
        add_header Cache-Control "no-cache" always;
        try_files $uri =404;
    }

    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        try_files $uri =404;
    }

    location / {
        add_header Cache-Control "no-cache" always;
        try_files $uri $uri/ /index.html;
    }
}
