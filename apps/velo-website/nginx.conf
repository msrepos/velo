server {
    listen 8080;
    server_name velo.internal;
    root /usr/share/nginx/html;
    index index.html;
    server_tokens off;
    absolute_redirect off;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header X-Frame-Options DENY always;
    add_header Content-Security-Policy "default-src 'self'; img-src 'self'; script-src 'self'; style-src 'self'; connect-src 'self'; object-src 'none'; base-uri 'self'; frame-ancestors 'none'; form-action 'none'" always;
    gzip on;
    gzip_types text/css application/javascript image/svg+xml;
    location = /health/live {
        access_log off;
        default_type text/plain;
        return 200 "Healthy\n";
    }
    location = /health/ready {
        access_log off;
        try_files /index.html =503;
    }
    location / {
        try_files $uri $uri/ =404;
    }
    error_page 404 /404.html;
}
