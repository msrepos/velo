name: velo-local

x-api: &api
  image: velo-api:local
  build:
    context: .
    dockerfile: Dockerfile
  environment:
    ASPNETCORE_ENVIRONMENT: Development
    DOTNET_ENVIRONMENT: Development
    ConnectionStrings__Velo: "Server=sqlserver;Database=velo;User Id=sa;Password=${MSSQL_SA_PASSWORD:?Set MSSQL_SA_PASSWORD};Encrypt=True;TrustServerCertificate=True;Persist Security Info=False"
    Authentication__OtpHashKey: ${VELO_OTP_HASH_KEY:?Set VELO_OTP_HASH_KEY}
    AllowedHosts: localhost;127.0.0.1;api
  read_only: true
  tmpfs:
    - /tmp
  security_opt:
    - no-new-privileges:true

services:
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_PID: Developer
      MSSQL_SA_PASSWORD: ${MSSQL_SA_PASSWORD:?Set MSSQL_SA_PASSWORD}
    volumes:
      - sqlserver_data:/var/opt/mssql
    healthcheck:
      test:
        - CMD-SHELL
        - '/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P "$$MSSQL_SA_PASSWORD" -C -Q "SELECT 1" -b -o /dev/null || exit 1'
      interval: 10s
      timeout: 5s
      retries: 15
      start_period: 30s
    restart: unless-stopped

  migrator:
    <<: *api
    command: ["--migrate", "true"]
    depends_on:
      sqlserver:
        condition: service_healthy
    restart: "no"

  api:
    <<: *api
    ports:
      - "127.0.0.1:${VELO_HTTP_PORT:-5080}:8080"
    depends_on:
      sqlserver:
        condition: service_healthy
      migrator:
        condition: service_completed_successfully
    restart: unless-stopped

volumes:
  sqlserver_data:
