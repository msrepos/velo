name: velo-api
x-api: &api
  image: velo-api:local
  build:
    context: ../..
    dockerfile: Dockerfile
  environment:
    ASPNETCORE_ENVIRONMENT: Development
    DOTNET_ENVIRONMENT: Development
    ConnectionStrings__Velo: ${VELO_SQL_CONNECTION_STRING:?Set VELO_SQL_CONNECTION_STRING}
    Authentication__OtpHashKey: ${VELO_OTP_HASH_KEY:?Set VELO_OTP_HASH_KEY}
    AllowedHosts: localhost;127.0.0.1;velo-api
  read_only: true
  tmpfs:
    - /tmp
  security_opt:
    - no-new-privileges:true
services:
  api:
    <<: *api
    ports:
      - "127.0.0.1:${VELO_HTTP_PORT:-5080}:8080"
    restart: unless-stopped
  migrator:
    <<: *api
    profiles: [tools]
    command: ["--migrate", "true"]
