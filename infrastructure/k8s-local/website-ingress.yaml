apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: velo-website
  namespace: velo
  annotations:
    traefik.ingress.kubernetes.io/router.entrypoints: websecure
spec:
  ingressClassName: velo-traefik
  tls:
    - hosts: [velo.internal]
      secretName: velo-wildcard-tls
  rules:
    - host: velo.internal
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: velo-website
                port:
                  number: 80
