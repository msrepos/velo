apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: velo-pwa
  namespace: velo
  annotations:
    traefik.ingress.kubernetes.io/router.entrypoints: websecure
spec:
  ingressClassName: velo-traefik
  tls:
    - hosts: [app.velo.internal]
      secretName: velo-wildcard-tls
  rules:
    - host: app.velo.internal
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: velo-pwa
                port:
                  number: 80
