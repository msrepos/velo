# Contains a private key. Do not commit or share this file.
# Keep this certificate and its password across deployments to preserve access to existing keys.
# Certificate expires 2028-10-25 UTC; rotate before expiry.
# /tmp is already an emptyDir in deployment.yaml and migration-job.yaml.
# Both workloads mount this Secret at /certs/identity.pfx. No PVC is required.
apiVersion: v1
kind: Secret
metadata:
  name: velo-dataprotection
  namespace: velo
type: Opaque
data:
  identity.pfx: 
